<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Evento - OCV Monterrey</title>
    <style>
        :root {
            --primary-orange: #e65c00;
            --dark-orange: #b34700;
            --light-orange: #ff944d;
            --bg-gradient: linear-gradient(135deg, #cc4400 0%, #ff8533 50%, #e65c00 100%);
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de Splash / Bienvenida */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        #splash-screen img {
            width: 85%;
            max-width: 450px;
            margin-bottom: 20px;
            border-radius: 8px;
            animation: pulse 2s infinite;
        }

        #splash-screen h2 {
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            font-size: 16px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Contenedor Principal */
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            margin: 20px;
            display: none; /* Oculto inicialmente hasta que pase el splash */
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        h1 {
            color: var(--dark-orange);
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }

        .radio-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .radio-card input {
            display: none;
        }

        .radio-card.selected-si {
            border-color: #28a745;
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .radio-card.selected-no {
            border-color: #dc3545;
            background-color: #ffebee;
            color: #c62828;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            border-color: var(--primary-orange);
        }

        #hidden-fields {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button[type="submit"] {
            width: 100%;
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: var(--dark-orange);
        }

        #loading-spinner {
            display: none;
            text-align: center;
            color: var(--dark-orange);
            font-weight: bold;
            margin-top: 15px;
        }

        #success-message {
            display: none;
            text-align: center;
            color: #2e7d32;
            font-weight: bold;
            font-size: 18px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Splash con la imagen PNG -->
    <div id="splash-screen">
        <img src="logossedenl.png" alt="Logos Sede NL">
        <h2>Cargando experiencia...</h2>
    </div>

    <!-- Contenido Principal del Formulario -->
    <div class="container" id="main-content">
        <div class="logo-container">
            <img src="logossedenl.png" alt="Logos Sede NL">
        </div>
        <h1>Confirmación de Evento</h1>
        <p class="subtitle">Sede Nuevo León - OCV Monterrey</p>

        <form id="rsvp-form">
            <div class="form-group">
                <label>¿Confirma su asistencia al evento?</label>
                <div class="radio-group">
                    <label class="radio-card" id="card-si">
                        <input type="radio" name="asistencia" value="Si" required> Sí, asistiré
                    </label>
                    <label class="radio-card" id="card-no">
                        <input type="radio" name="asistencia" value="No"> No podré asistir
                    </label>
                </div>
            </div>

            <!-- Campos condicionales que aparecen solo si selecciona Sí -->
            <div id="hidden-fields">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com">
                </div>
            </div>

            <button type="submit" id="submit-btn">Enviar Respuesta</button>
            <div id="loading-spinner">Enviando información...</div>
        </form>

        <div id="success-message">
            ¡Muchas gracias por su respuesta! La información ha sido enviada correctamente.
        </div>
    </div>

    <script>
        // Control del Splash Screen (se oculta tras 2 segundos)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    main.style.display = 'block';
                }, 800);
            }, 2000);
        });

        // Lógica condicional para mostrar nombre y correo si dice "Sí"
        const radios = document.querySelectorAll('input[name="asistencia"]');
        const hiddenFields = document.getElementById('hidden-fields');
        const cardSi = document.getElementById('card-si');
        const cardNo = document.getElementById('card-no');
        const nombreInput = document.getElementById('nombre');
        const correoInput = document.getElementById('correo');

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'Si') {
                    hiddenFields.style.display = 'block';
                    nombreInput.required = true;
                    correoInput.required = true;
                    cardSi.classList.add('selected-si');
                    cardNo.classList.remove('selected-no');
                } else {
                    hiddenFields.style.display = 'none';
                    nombreInput.required = false;
                    correoInput.required = false;
                    nombreInput.value = '';
                    correoInput.value = '';
                    cardNo.classList.add('selected-no');
                    cardSi.classList.remove('selected-si');
                }
            });
        });

        // Envío de datos mediante fetch hacia Google Apps Script
        const form = document.getElementById('rsvp-form');
        const submitBtn = document.getElementById('submit-btn');
        const loadingSpinner = document.getElementById('loading-spinner');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            submitBtn.style.display = 'none';
            loadingSpinner.style.display = 'block';

            const asistenciaValue = document.querySelector('input[name="asistencia"]:checked').value;
            const formData = {
                asistencia: asistenciaValue,
                nombre: nombreInput.value,
                correo: correoInput.value
            };

            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxtQc1iTRNANF5IJ-_nnDreH30dHET-bNGH6kasa5onPHgWhZ8LTjzGvWbBg1y2cigHyw/exec';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                form.style.display = 'none';
                loadingSpinner.style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Hubo un error al enviar la información. Por favor intente de nuevo.');
                submitBtn.style.display = 'block';
                loadingSpinner.style.display = 'none';
            });
        });
    </script>
</body>
</html>
